name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        revit: ["2019", "2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build plugin (Revit ${{ matrix.revit }})
        run: dotnet build src/RevitMCP.Plugin/RevitMCP.Plugin.csproj -c R${{ matrix.revit }}

  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/RevitMCP.Tests/RevitMCP.Tests.csproj -c R2025
